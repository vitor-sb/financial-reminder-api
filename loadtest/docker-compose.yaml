# Infra descartável do teste de carga (portas e nomes próprios, sem volumes). Credenciais fictícias.
name: fra-loadtest
services:
  postgres:
    image: postgres:17-alpine
    container_name: fra-loadtest-pg
    environment: {POSTGRES_DB: finance-management, POSTGRES_USER: postgres, POSTGRES_PASSWORD: loadtest}
    ports: ["127.0.0.1:15432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d finance-management"], interval: 2s, retries: 30}
  redis:
    image: redis:7.2-alpine
    container_name: fra-loadtest-redis
    command: redis-server --requirepass loadtest
    ports: ["127.0.0.1:16379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "-a", "loadtest", "ping"], interval: 2s, retries: 30}
