infrastructure:
  security:
    authentication:
      token:
        secret-key: ${JWT_SECRET}
    jce:
      secret-key: ${JCE_SECRET}
  redis:
    login-attempt:
      max-attempts: 5
      block-time-minutes: 5
      block-time-multiplier: 2

spring:
  application:
    name: finance-management
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${DATABASE_HOST}:${DATABASE_PORT}/finance-management"
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show-sql: false
    open-in-view: false
  data:
    redis:
      host: {REDIS_HOST}
      port: {REDIS_PORT}
      password: ${REDIS_PASSWORD}
logging:
  level:
    ROOT: INFO
    org:
      hibernate: ERROR
      springframework: INFO
    web: ERROR
    liquibase: ERROR