infrastructure:
  security:
    authentication:
      token:
        secret-key: ${JWT_SECRET}
        expiration-minutes: 30

spring:
  application:
    name: financial-reminder-api
  datasource:
    driver-class-name: org.postgresql.Driver
    url: "jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/finance-management"
    username: ${API_DB_USER}
    password: ${API_DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show-sql: false
    open-in-view: false
  data:
    redis:
      host: {REDIS_HOST}
      port: {REDIS_PORT}
      password: ${REDIS_PASSWORD}
  devtools:
    livereload:
      enabled: false

logging:
  level:
    ROOT: INFO
    org:
      hibernate: ERROR
      springframework: INFO
    web: ERROR
    liquibase: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"