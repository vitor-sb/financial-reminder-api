definitions:
  - &auditColumns
    - column:
        name: id
        type: varchar(36)
        constraints:
          primaryKey: true
          nullable: false
    - column:
        name: enabled
        type: BOOLEAN
        defaultValueBoolean: true
        constraints:
          nullable: false
    - column:
        name: enabled_at
        type: TIMESTAMP WITH TIME ZONE
        constraints:
          nullable: true
    - column:
        name: enabled_by
        type: varchar(36)
        constraints:
          nullable: true
    - column:
        name: deleted
        type: BOOLEAN
        defaultValueBoolean: false
        constraints:
          nullable: false
    - column:
        name: deleted_at
        type: TIMESTAMP WITH TIME ZONE
        constraints:
          nullable: true
    - column:
        name: deleted_by
        type: varchar(36)
        constraints:
          nullable: true
    - column:
        name: created_by
        type: VARCHAR(254)
        constraints:
          nullable: true
    - column:
        name: created_at
        type: TIMESTAMP WITH TIME ZONE
        constraints:
          nullable: false
        defaultValueComputed: CURRENT_TIMESTAMP
    - column:
        name: updated_by
        type: VARCHAR(254)
        constraints:
          nullable: true
    - column:
        name: updated_at
        type: TIMESTAMP WITH TIME ZONE
        constraints:
          nullable: true
databaseChangeLog:
  - changeSet:
      id: create-users-audit-table
      author: vitor-sb
      changes:
        - createTable:
            tableName: users_audit
            columns: *auditColumns

  - changeSet:
      id: create-table-users
      author: vitor-sb
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(254)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: audit_id
                  type: varchar(36)
                  constraints:
                    unique: true

        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: audit_id
            constraintName: fk_users_audit_id
            referencedTableName: users_audit
            referencedColumnNames: id
