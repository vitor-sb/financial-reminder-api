databaseChangeLog:
  - changeSet:
      id: 0003-change-role-schema
      author: vitor-sb
      changes:
        - dropTable:
            tableName: user_roles
            cascadeConstraints: true

        - addColumn:
            tableName: users
            columns:
              - column:
                  name: role
                  type: varchar(50)
                  constraints:
                    nullable: false
