definitions:
  - &auditColumns
    - column:
        name: id
        type: varchar(36)
        constraints:
          primaryKey: true
          nullable: false
    - column:
        name: enabled
        type: BOOLEAN
        defaultValueBoolean: true
        constraints:
          nullable: false
    - column:
        name: enabled_at
        type: TIMESTAMP WITH TIME ZONE
        constraints:
          nullable: true
    - column:
        name: enabled_by
        type: varchar(36)
        constraints:
          nullable: true
    - column:
        name: deleted
        type: BOOLEAN
        defaultValueBoolean: false
        constraints:
          nullable: false
    - column:
        name: deleted_at
        type: TIMESTAMP WITH TIME ZONE
        constraints:
          nullable: true
    - column:
        name: deleted_by
        type: varchar(36)
        constraints:
          nullable: true
    - column:
        name: created_by
        type: VARCHAR(254)
        constraints:
          nullable: true
    - column:
        name: created_at
        type: TIMESTAMP WITH TIME ZONE
        constraints:
          nullable: false
        defaultValueComputed: CURRENT_TIMESTAMP
    - column:
        name: updated_by
        type: VARCHAR(254)
        constraints:
          nullable: true
    - column:
        name: updated_at
        type: TIMESTAMP WITH TIME ZONE
        constraints:
          nullable: true

databaseChangeLog:
  - changeSet:
      id: 0002-create-payment-reminders-audit-table
      author: vitor-sb
      changes:
        - createTable:
            tableName: payment_reminders_audit
            columns: *auditColumns

  - changeSet:
      id: 0002-create-payment-reminders-table
      author: vitor-sb
      changes:
        - createTable:
            tableName: payment_reminders
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKey: true
                    references: users(id)
                    foreignKeyName: fk_payment_reminder_user
              - column:
                  name: title
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(100)
              - column:
                  name: base_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: recurrence
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: base_value
                  type: DECIMAL(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: installments_number
                  type: INT
              - column:
                  name: method
                  type: VARCHAR(30)
              - column:
                  name: audit_id
                  type: varchar(36)
                  constraints:
                    unique: true

        - addForeignKeyConstraint:
            baseTableName: payment_reminders
            baseColumnNames: audit_id
            constraintName: fk_payment_reminders_audit_id
            referencedTableName: payment_reminders_audit
            referencedColumnNames: id

  - changeSet:
      id: 0002-create-payment-transactions-audit-table
      author: vitor-sb
      changes:
        - createTable:
            tableName: payment_transactions_audit
            columns: *auditColumns

  - changeSet:
      id: 0002-create-payment-transactions-table
      author: vitor-sb
      changes:
        - createTable:
            tableName: payment_transactions
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: reminder_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKey: true
                    references: payment_reminders(id)
                    foreignKeyName: fk_payment_transaction_payment_reminder
              - column:
                  name: payment_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: method
                  type: VARCHAR(30)
              - column:
                  name: installment_number
                  type: INT
              - column:
                  name: payment_value
                  type: DECIMAL(10, 2)
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: audit_id
                  type: varchar(36)
                  constraints:
                    unique: true

        - addForeignKeyConstraint:
            baseTableName: payment_transactions
            baseColumnNames: audit_id
            constraintName: fk_payment_transactions_audit_id
            referencedTableName: payment_transactions_audit
            referencedColumnNames: id
