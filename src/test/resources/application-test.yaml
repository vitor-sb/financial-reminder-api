infrastructure:
  security:
    authentication:
      token:
        secret-key: testSecret
  redis:
    login-attempt:
      max-attempts: 5
      block-time-minutes: 5
      block-time-multiplier: 2
spring:
  application:
    name: finance-management-test
  datasource:
    driver-class-name: org.h2.Driver
    url: "jdbc:h2:mem:finance-management-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
    username: userTest
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate