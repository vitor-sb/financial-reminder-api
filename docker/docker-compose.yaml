services:
  financial_management_db:
    image: postgres:17-alpine
    container_name: financial_management_postgres_container
    profiles: ["infra"]
    environment:
      # PostgreSQL default variables
      POSTGRES_DB: finance-management
      POSTGRES_USER: ${ROOT_DB_USER}
      POSTGRES_PASSWORD: ${ROOT_DB_PASSWORD}
      # Custom variables for our startup scripts
      API_DB_USER: ${API_DB_USER}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
      APPLICATION_OWNER_EMAIL: ${APPLICATION_OWNER_EMAIL}
      APPLICATION_OWNER_NAME: ${APPLICATION_OWNER_NAME}
      APPLICATION_OWNER_PASSWORD_HASH: ${APPLICATION_OWNER_PASSWORD_HASH}
    ports:
      - "5432:5432"
    volumes:
      - financial_management_postgres_data:/var/lib/postgresql/data
      - ./docker/scripts/db:/docker-entrypoint-initdb.d
    networks:
      - financial_management_network
    restart: always

  financial_management_redis:
    image: redis:7.2-alpine
    container_name: financial_management_redis_container
    profiles: ["infra"]
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file:
      - ./.env
    ports:
      - "6379:6379"
    volumes:
      - financial_management_redis_data:/data
    networks:
      - financial_management_network
    restart: always

  financial_reminder_api:
    build: .
    container_name: financial_reminder_api_container
    profiles: ["app"]
    ports:
      - "8080:8080"
    networks:
      - financial_management_network
    env_file:
      - ./.env
    depends_on:
      - financial_management_db
      - financial_management_redis
    restart: always

volumes:
  financial_management_postgres_data:
  financial_management_redis_data:

networks:
  financial_management_network:
    driver: bridge
