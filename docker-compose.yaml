services:
  financial_management_db:
    image: postgres:17-alpine
    container_name: financial_management_postgres_container
    environment:
      POSTGRES_DB: finance-management
      POSTGRES_USER: ${ROOT_DB_USER}
      POSTGRES_PASSWORD: ${ROOT_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - financial_management_postgres_data:/var/lib/postgresql/data
    networks:
      - financial_management_network
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${ROOT_DB_USER} -d finance-management" ]
      interval: 10s
      timeout: 5s
      retries: 5

  financial_management_redis:
    image: redis:7.2-alpine
    container_name: financial_management_redis_container
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - financial_management_redis_data:/data
    networks:
      - financial_management_network
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  financial_reminder_api:
    build: .
    container_name: financial_reminder_api_container
    ports:
      - "8080:8080"
    networks:
      - financial_management_network
    env_file:
      - ./.env
    depends_on:
      financial_management_db:
        condition: service_healthy
      financial_management_redis:
        condition: service_healthy
    restart: always

volumes:
  financial_management_postgres_data:
  financial_management_redis_data:

networks:
  financial_management_network:
    driver: bridge
