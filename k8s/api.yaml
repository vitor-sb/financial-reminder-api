apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: financial
spec:
  selector: { app: api }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: financial
spec:
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: financial-reminder-api:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom:
            - secretRef: { name: financial-env }
          # env explícito vence o envFrom: troca os hosts de localhost do .env pelos Services
          env:
            - { name: DATABASE_HOST, value: postgres }
            - { name: DATABASE_PORT, value: "5432" }
            - { name: REDIS_HOST, value: redis }
            - { name: REDIS_PORT, value: "6379" }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
          resources:
            limits: { memory: 768Mi }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: financial
spec:
  rules:
    - host: financial.localhost
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: api, port: { number: 80 } } } }
